I'm adding a comprehensive multi-dimensional assessment to Circaday — a React + Appwrite PWA for neurodivergent users. This replaces/extends the existing 5-question QuizFlow and produces a rich profile that powers the entire app experience.

TECH STACK:
- React 18 + Vite (plain JSX, no TypeScript)
- Appwrite backend (configured in src/lib/appwrite.js and src/lib/db.js)
- Framer Motion for animations
- React Router for navigation
- Inline JS styles ONLY — no CSS files, no Tailwind, no CSS modules
- Dark theme with CSS variables: --bg-primary, --bg-elevated, --text-primary, --text-secondary, --border, --accent (violet/indigo)
- Fonts: 'Fraunces' (serif, for headers/display) and 'Inter' (sans-serif, for body)

EXISTING STRUCTURE:
- src/components/QuizFlow.jsx — the current 5-question quiz (we are REPLACING this)
- src/data/archetypes.js — 16 archetypes keyed by modifier_chronotype (e.g. wandering_wolf)
- calculateArchetype(answers) lives in archetypes.js, takes array of { questionId, answerId }
- src/components/ProfileReveal.jsx — shows archetype result after quiz
- src/lib/db.js — all Appwrite calls including updateProfile(userId, archetypeId, quizAnswers)
- The profile Appwrite document stores: archetype_id, quiz_answers (JSON string), and we will add new dimensional score fields

EXISTING ARCHETYPES (do not change these):
16 archetypes = 4 chronotypes (lion/bear/wolf/dolphin) × 4 modifiers (novelty_seeking/deep_diving/precision/wandering)
calculateArchetype() maps answers.chronotype + answers.energy → base type, answers.procrastination → modifier

