## IMPLEMENTATION NOTES

- The existing calculateArchetype() in archetypes.js can be preserved for backward compatibility, but the new scoring.js takes precedence for new users
- scoreQuiz() should produce answers in the format calculateArchetype() expects as a fallback { questionId: 'chronotype', answerId: 'A'|'B'|'C'|'D' }
- All dimensional scores should be saved to Appwrite profiles collection via an extended updateProfile() call or a new updateProfileDimensions(userId, scores) function in db.js
- The quiz must be completable in one sitting — no multi-session state (keep it simple)
- Error states silent (console.error only)
- No shame language anywhere in the UI — reframe everything as information, not judgment
- Every archetype and every score is presented with a "this is how you're wired, not what's wrong with you" frame