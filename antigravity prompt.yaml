## PART 3 — SCORING ENGINE (src/lib/scoring.js)

Create this file. It takes the raw answers array and returns a scored profile object.

CHRONOTYPE SCORE (0–100, higher = more evening/wolf):
- chrono_1 through chrono_3: map option values 1–5, average them, normalize to 0–100
- chrono_4 (slider 1–5): add to evening score (higher difficulty = more evening-leaning)
- Final chronotype_score = weighted average

CHRONOTYPE CLASSIFICATION (for calculateArchetype compatibility):
- 0–30 → lion (answerId: 'A')
- 31–50 → bear (answerId: 'B')  
- 51–75 → wolf (answerId: 'C')
- 76–100 → dolphin (answerId: 'D')

SOCIAL JETLAG: Pull directly from chrono_5 option value (in minutes)

PRODUCTIVITY STYLE: Most common answer across prod_1–prod_4 (prioritizer/planner/arranger/visualizer take priority from prod_1; maker/sprinter signals are secondary flags)

PROCRASTINATION TYPE:
- proc_1 answer is primary classification
- proc_2 >= 4 overrides or co-labels as interest_blocked
- proc_3 >= 4 co-labels perfectionist
- proc_4 >= 4 adds demand_avoidance flag (score = proc_4 value × 2, capped at 10)

HABIT TENDENCY: Direct from habit_1 answer

NEURODIVERGENT SCORES:
- hyperfocus_tendency = average of nd_1 and nd_2 slider values × 2 (0–10)
- sensory_sensitivity = nd_3 slider value × 2 (0–10)
- initiation_difficulty = derived: if proc_1 is overwhelmed or interest_blocked AND proc_2 >= 4, score 8–10; otherwise scale from proc_2 + proc_4

PROCRASTINATION MODIFIER → archetype modifier mapping:
- perfectionist → precision
- thrill_seeker → novelty_seeking
- overwhelmed → wandering
- interest_blocked → novelty_seeking
- anxious → deep_diving
- rebellious → wandering

scoreQuiz(answers) should return:
{
  chronotype_score: number,
  chronotype_key: 'lion' | 'bear' | 'wolf' | 'dolphin',
  productivity_style: string,
  procrastination_type: string,
  habit_tendency: string,
  social_jetlag: number,
  demand_avoidance: number,
  initiation_difficulty: number,
  hyperfocus_tendency: number,
  sensory_sensitivity: number,
  structure_preference: string, // derived from prod_4: structured_high→rigid, structured_moderate→thematic, fluid/audhd_signal→fluid
  archetype_modifier: string,
  archetype_id: string // modifier_chronotype_key
}

