IMPLEMENT THESE EXACT QUESTIONS in order:

SECTION 1 — CHRONOTYPE (5 questions, ids: chrono_1 through chrono_5)

chrono_1:
Question: "On a completely free day with no obligations, what time would you naturally wake up?"
Format: single_select
Options:
  A: Before 6 AM → value: 1
  B: 6–7:30 AM → value: 2
  C: 7:30–9 AM → value: 3
  D: 9–10:30 AM → value: 4
  E: After 10:30 AM → value: 5

chrono_2:
Question: "When do you feel most mentally sharp?"
Format: single_select
Options:
  A: Early morning (before 9 AM) → value: 1
  B: Late morning (9 AM–noon) → value: 2
  C: Afternoon (noon–5 PM) → value: 3
  D: Evening (5–9 PM) → value: 4
  E: Late night (after 9 PM) → value: 5

chrono_3:
Question: "If you had to do your hardest mental work, when would you choose?"
Format: single_select
Options:
  A: Early morning → value: 1
  B: Mid-morning → value: 2
  C: Afternoon → value: 3
  D: Evening → value: 4
  E: Late night → value: 5

chrono_4:
Question: "How difficult is it for you to function in the early morning?"
Subtext: "Think about your actual experience, not what you wish were true."
Format: slider (1 = Not at all difficult, 5 = Extremely difficult)

chrono_5:
Question: "On a typical work or school day vs. a free day, how different are your sleep times?"
Subtext: "This helps us spot if your schedule and your biology are fighting each other."
Format: single_select
Options:
  A: Pretty similar (less than 1 hour difference) → social_jetlag: 0
  B: Somewhat different (1–2 hours) → social_jetlag: 60
  C: Noticeably different (2–3 hours) → social_jetlag: 150
  D: Very different (3+ hours) → social_jetlag: 210

SECTION 2 — PRODUCTIVITY STYLE (4 questions, ids: prod_1 through prod_4)

prod_1:
Question: "You have a big project to start. What do you do first?"
Format: single_select
Options:
  A: Define the goal and highest-value outcome → prioritizer
  B: Map out a step-by-step plan → planner
  C: Think about who needs to be involved → arranger
  D: Try to understand the big picture first → visualizer

prod_2:
Question: "Does having a meeting scheduled later in the day make it hard to focus before it?"
Subtext: "Even if the meeting is hours away."
Format: single_select
Options:
  A: Yes, it fragments my whole day → maker_schedule
  B: Not really, I just note it and keep working → manager_schedule
  C: Only if it's something I'm anxious about → anxiety_related
  D: I forget about it until right before → time_blindness

prod_3:
Question: "Do you produce better work under deadline pressure, or does pressure make you anxious?"
Format: single_select
Options:
  A: Definitely better — I need the urgency → sprinter
  B: Worse — pressure makes me freeze or spiral → marathoner
  C: Better in the moment but I regret waiting → mixed
  D: It depends entirely on whether I care about the task → interest_based

prod_4:
Question: "When something unexpected disrupts your plan, what's your gut reaction?"
Subtext: "Not what you think you should feel — what you actually feel."
Format: single_select
Options:
  A: Significant distress, hard to recover → structured_high
  B: Mild frustration, I adapt fairly quickly → structured_moderate
  C: Honestly kind of relieved — a reason to pivot → fluid
  D: Both: I hate it AND I secretly welcome it → audhd_signal

SECTION 3 — PROCRASTINATION TYPE (4 questions, ids: proc_1 through proc_4)

proc_1:
Question: "You have an important project due in two weeks. What most likely happens?"
Format: single_select
Options:
  A: I start right away but keep revising endlessly → perfectionist
  B: I feel weirdly energized as the deadline gets close → thrill_seeker
  C: I think about starting constantly but feel too overwhelmed to begin → overwhelmed
  D: I forget about it until something reminds me → interest_blocked
  E: I feel anxious every time I think about it → anxious
  F: I resent that I have to do it at all → rebellious

proc_2:
Question: "My motivation depends on whether I find something interesting, not on how important it is."
Subtext: "Answer honestly — there's no wrong answer here."
Format: scale_5 (1 = Strongly disagree, 5 = Strongly agree)
// High score → interest_blocked / ADHD signal

proc_3:
Question: "I avoid tasks because I'm afraid the result won't be good enough."
Format: scale_5 (1 = Strongly disagree, 5 = Strongly agree)
// High score → perfectionist signal

proc_4:
Question: "Being told I 'have to' do something makes me want to do it less — even if I chose it myself."
Format: scale_5 (1 = Strongly disagree, 5 = Strongly agree)
// High score → demand avoidance signal

SECTION 4 — HABIT TENDENCY (3 questions, ids: habit_1 through habit_3)

habit_1:
Question: "Have you ever kept a habit or resolution that only YOU knew about — no one checking on you?"
Format: single_select
Options:
  A: Yes, easily — I do what I set out to do → upholder
  B: Sometimes, if I'm completely convinced it's worth it → questioner
  C: Rarely — I need someone else to know or I lose momentum → obliger
  D: The concept of keeping a resolution feels like a trap → rebel

habit_2:
Question: "When asked to do something you think is pointless, what do you do?"
Format: single_select
Options:
  A: Do it anyway — it's expected → upholder
  B: Ask why and push back if the answer isn't satisfying → questioner
  C: Do it to avoid conflict, and quietly resent it → obliger
  D: Find a way around it, or just don't do it → rebel

habit_3:
Question: "What usually happens when you try a new productivity system?"
Format: single_select
Options:
  A: I use it consistently for months → upholder / planner
  B: I'm really excited at first, then stop using it within a few weeks → novelty / adhd
  C: I use it sometimes and sometimes forget → inconsistent
  D: I've never found one that actually works for my brain → system_failure

SECTION 5 — NEURODIVERGENT PATTERNS (4 questions, ids: nd_1 through nd_4)

nd_1:
Question: "How often do you lose track of time without realizing it?"
Subtext: "Starting a task and suddenly it's been 3 hours."
Format: slider (1 = Never, 5 = Constantly)
// High score → time_blindness / hyperfocus_tendency

nd_2:
Question: "When you're deeply absorbed in something interesting, how hard is it to stop?"
Format: slider (1 = Easy to stop, 5 = Nearly impossible)
// High score → hyperfocus_tendency

nd_3:
Question: "How sensitive are you to your environment — noise, light, temperature, textures?"
Format: slider (1 = Not sensitive, 5 = Very sensitive)
// sensory_sensitivity score

nd_4:
Question: "What environment do you actually work best in?"
Format: single_select
Options:
  A: Very quiet and calm
  B: Specific background sounds (music, white noise)
  C: Content audio — podcasts, videos, something to listen to
  D: Some activity and buzz around me
  E: It changes completely depending on my mood or task

